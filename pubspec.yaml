name: filezen
description: "FileZen — Your files, understood by AI. Next-generation Android file manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.13.1 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  cupertino_icons: ^1.0.8
  path: ^1.9.0
  path_provider: ^2.1.5
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28

  # WAPCentral Core SDK (Client foundation)
  wap_core_sdk:
    path: ../WAPCentral/sdks/wap_core_sdk

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

flutter:
  uses-material-design: true
